<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Décentralisation et autonomie départementale">
  <defs>
    <linearGradient id="bgDec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#283A4C" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgDec)" />
  <!-- Carte stylisée des 10 départements d'Haïti avec points nodaux en or -->
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <!-- Réseau d'interconnexion territoriale -->
    <line x1="80" y1="140" x2="160" y2="150" />
    <line x1="160" y1="150" x2="230" y2="130" />
    <line x1="230" y1="130" x2="300" y2="80" />
    <line x1="230" y1="130" x2="280" y2="160" />
    <line x1="300" y1="80" x2="350" y2="70" />
  </g>
  <!-- Nœuds régionaux départementaux -->
  <circle cx="80" cy="140" r="10" fill="#0B2748" stroke="#AD8B60" stroke-width="3" />
  <circle cx="160" cy="150" r="12" fill="#0B2748" stroke="#AD8B60" stroke-width="3" />
  <circle cx="230" cy="130" r="14" fill="#0B2748" stroke="#AD8B60" stroke-width="3.5" />
  <circle cx="300" cy="80" r="11" fill="#0B2748" stroke="#AD8B60" stroke-width="3" />
  <circle cx="350" cy="70" r="9" fill="#0B2748" stroke="#AD8B60" stroke-width="2.5" />
  <circle cx="280" cy="160" r="10" fill="#0B2748" stroke="#AD8B60" stroke-width="3" />

  <text x="200" y="210" font-family="'Source Sans 3', sans-serif" font-weight="900" font-size="12" fill="#AD8B60" text-anchor="middle" letter-spacing="2">AUTONOMIE DES 10 DÉPARTEMENTS</text>
  <rect x="0" y="235" width="400" height="5" fill="#AD8B60" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" role="img" aria-label="Logo Fòs Chanjman Nasyonal version fond foncé">
  <defs>
    <linearGradient id="curveGradWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AD8B60" />
      <stop offset="100%" stop-color="#C6AA84" />
    </linearGradient>
  </defs>

  <!-- Emblem / Graphic Symbol -->
  <g transform="translate(10, 10)">
    <!-- White outer rim / shield -->
    <circle cx="40" cy="40" r="35" fill="rgba(255,255,255,0.15)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Distinctive dynamic upward curve in accent yellow #AD8B60 -->
    <path d="M 12 55 Q 38 10, 70 24 Q 45 42, 22 62 Z" fill="url(#curveGradWhite)" />
    
    <!-- Star -->
    <polygon points="40,22 43,30 52,30 45,35 48,43 40,38 32,43 35,35 28,30 37,30" fill="#FFFFFF" />
  </g>

  <!-- Typography: FÒS CHANJMAN NASYONAL (White version) -->
  <g transform="translate(98, 20)">
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="1.5">FÒS CHANJMAN</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#AD8B60" letter-spacing="3.2">NASYONAL</text>
    <path d="M 0 60 Q 90 64, 180 58" stroke="#AD8B60" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-label="Emplacement réservé portrait officiel Jean Ernest Muscadin">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F7" />
      <stop offset="100%" stop-color="#E9EEF2" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0B2748" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)" />
  <rect width="600" height="700" fill="url(#gridPattern)" />

  <!-- Outer frame border with accent yellow notch -->
  <rect x="20" y="20" width="560" height="660" rx="8" fill="none" stroke="#0B2748" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.5" />
  
  <!-- Silhouette placeholder -->
  <g transform="translate(300, 290)">
    <!-- Head -->
    <circle cx="0" cy="-60" r="75" fill="#0B2748" fill-opacity="0.15" stroke="#0B2748" stroke-width="2" stroke-opacity="0.4" />
    <!-- Shoulders -->
    <path d="M -130,120 C -120,40 -60,0 0,0 C 60,0 120,40 130,120 Z" fill="#0B2748" fill-opacity="0.15" stroke="#0B2748" stroke-width="2" stroke-opacity="0.4" />
    <!-- Camera / Document icon badge -->
    <circle cx="0" cy="15" r="32" fill="#0B2748" />
    <path d="M -14 7 L -10 -2 L 10 -2 L 14 7 L 18 7 C 20 7 21 8 21 10 L 21 24 C 21 26 20 27 18 27 L -18 27 C -20 27 -21 26 -21 24 L -21 10 C -21 8 -20 7 -18 7 Z" fill="#AD8B60" />
    <circle cx="0" cy="17" r="6" fill="#0B2748" stroke="#AD8B60" stroke-width="2" />
  </g>

  <!-- Descriptive text tag -->
  <g transform="translate(300, 470)">
    <rect x="-240" y="0" width="480" height="130" rx="6" fill="#FFFFFF" stroke="#0B2748" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(36,26,43,0.08))" />
    <!-- Yellow top bar indicator -->
    <rect x="-240" y="0" width="480" height="6" rx="3" fill="#AD8B60" />
    
    <text x="0" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#0B2748" letter-spacing="1">EMPLACEMENT RÉSERVÉ</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#142B43">Photographie Officielle Autorisée</text>
    <text x="0" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#4D5F70">Jean Ernest Muscadin</text>
    <text x="0" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-style="italic" font-size="11" fill="#66788A">En attente de transmission et d’autorisation de droits</text>
  </g>
</svg>


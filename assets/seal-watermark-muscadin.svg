    <!-- Bonnet phrygien au sommet -->
    <path d="M -8,-95 C -8,-108 8,-108 8,-95 C 10,-88 -10,-88 -8,-95 Z" fill="#BEBEBE" />
    <circle cx="0" cy="-97" r="3" fill="#D8D8D8" />


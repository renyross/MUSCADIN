  <!-- Écusson central et armoiries républicaines -->
  <g transform="translate(300, 305)">
    <!-- Palmier de la liberté avec bonnet phrygien -->
    <path d="M -6,50 L -3,-45 L 3,-45 L 6,50 Z" fill="#C5C5C5" />
    <!-- Palmes du palmiste -->
    <path d="M 0,-45 C -25,-60 -50,-50 -60,-35 C -50,-40 -25,-45 0,-40 C 25,-45 50,-40 60,-35 C 50,-50 25,-60 0,-45 Z" fill="#CDCDCD" />

    <line x1="70" y1="55" x2="-70" y2="25" stroke="#B8B8B8" stroke-width="8" stroke-linecap="round" />
    
    <!-- Drapeaux haïtiens disposés de chaque côté -->
    <polygon points="-75,10 -40,-15 -42,20 -75,35" fill="#CCCCCC" />
    <polygon points="75,10 40,-15 42,20 75,35" fill="#CCCCCC" />
    
    <!-- Tambour républicain central -->
    <ellipse cx="0" cy="55" rx="36" ry="12" fill="#B5B5B5" />
    <path d="M -36,55 L -36,80 C -36,90 36,90 36,80 L 36,55 Z" fill="#C0C0C0" />
    <ellipse cx="0" cy="80" rx="36" ry="10" fill="#B5B5B5" />
    
    <!-- Écu d'honneur avec monogramme républicain JEM -->
    <path d="M -48,-15 C -48,35 0,65 0,65 C 0,65 48,35 48,-15 Z" fill="#F0F0F0" stroke="#BFBFBF" stroke-width="2.5" />
    <path d="M -42,-10 C -42,30 0,55 0,55 C 0,55 42,30 42,-10 Z" fill="#F8F8F8" stroke="#D0D0D0" stroke-width="1" />
    
    <!-- Monogramme JEM -->
    <text x="0" y="24" font-family="'Merriweather', Georgia, serif" font-weight="900" font-size="24" fill="#AAAAAA" text-anchor="middle" letter-spacing="1">JEM</text>
    
    <!-- Banderole de devise L'UNION FAIT LA FORCE -->
    <path d="M -75,95 Q 0,110 75,95 L 70,82 Q 0,95 -70,82 Z" fill="#E8E8E8" stroke="#BFBFBF" stroke-width="1" />
    <text x="0" y="93" font-family="'Source Sans 3', sans-serif" font-weight="800" font-size="7.5" fill="#888888" text-anchor="middle" letter-spacing="1.5">L'UNION FAIT LA FORCE</text>

    <!-- Branches de laurier et de chêne encadrant le sceau -->
    <path d="M -110,60 C -125,-20 -75,-70 -30,-90 C -45,-60 -65,-20 -60,60 Z" fill="#D5D5D5" opacity="0.6" />
    <path d="M 110,60 C 125,-20 75,-70 30,-90 C 45,-60 65,-20 60,60 Z" fill="#D5D5D5" opacity="0.6" />
